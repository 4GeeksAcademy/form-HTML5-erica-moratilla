<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Formulario de pago</title>
</head>
<body>
<div class="container mt-5">
<div class="card">
<div class=" card-body">
<!--Titulo de la card -->
<div class="card-header">
    <h3 class="card-title mb-0">Payment form example</h3>
</div>
<!--Alerta-->
<div class="alert alert-danger mt-3">
Some fields are missing
</div>
<!--Empiza el formulario-->
<form action="https://localhost:3000/test" method="POST">
<!--Primera linea-->
<div class="row">
<div class="col-md-6">
<div class="mb-3">
<label for="card" class="form-label">Card #</label>
<input type="text" class="form-control" id="card" maxlength="19" placeholder="XXXXXXXXXXXXXXXX">
</div>
</div>
<div class="col-md-3">
<div class="mb-3">
<label for="CVC" class="form-label">CVC #</label>
<input type="text" class="form-control" id="CVC" maxlength="3" placeholder="000">
</div>
</div>
<div class="col-md-3">
<div class="mb-3">
<label for="amount" class="form-label">Amount</label>
<div class="input-group">
<span class="input-group-text">€</span>
<input type="text" class="form-control" id="amount" placeholder="Amount">
</div>
</div>
</div>
</div>
<!--Segunda linea-->
<div class="row">
<div class="col-md-6">
<div class="mb-3">
<label for="firstname" class="form-label">First Name</label>
<input type="text" class="form-control" id="firstname">
</div>
</div>
<div class="col-md-6">
<div class="mb-3">
<label for="lastname" class="form-label">Last Name</label>
<input type="text" class="form-control" id="lastname">
</div>
</div>
</div>
<!--Tercera linea-->
<div class="row">
<div class="col-md-6">
<div class="mb-3">
<label for="city" class="form-label">City</label>
<input type="text" class="form-control" id="city">
</div>
</div>
<div class="col-md-3">
<div class="mb-3">
<label for="state" class="form-label">State</label>
<select id="state" name="state" class="form-control">
<option selected disabled>Pick a state</option>
<option value="España">España</option>
<option value="Alemania">Alemania</option>
<option value="Francia">Francia</option>
</select>
</div>
</div>
<div class="col-md-3">
<div class="mb-3">
<label for="postalcode" class="form-label">Postal Code</label>
<input type="text" class="form-control" id="PostalCode" maxlength="5">
</div>
</div>
</div>
<!--Cuarta linea-->
<div class="row">
<!-- Métodos de pago -->
<div class="col-md-6">
<div class="mb-3">
<label for="payment" class="form-label">We accept:</label>
<div class="d-flex align-items-center gap-3 mt-2 bg-body-secondary p-3 rounded border">
<div class="Mastercard">
<input type="radio" id="Mastercard" name="topay" value="Mastercard">
<label for="Mastercard">
<i class="fa-brands fa-cc-mastercard fa-xl"></i>
</label>
</div>
<div class="Visa">
<input type="radio" id="Visa" name="topay" value="Visa">
<label for="Visa">
<i class="fa-brands fa-cc-visa fa-xl"></i>
</label>
</div>
<div class="Amex">
<input type="radio" id="Amex" name="topay" value="Amex">
<label for="Amex">
<i class="fa-brands fa-cc-amex fa-xl"></i>
</label>
</div>
<div class="Diners">
<input type="radio" id="Diners" name="topay" value="Diners">
<label for="Diners">
<i class="fa-brands fa-cc-diners-club fa-xl"></i>
</label>
</div>
</div>
</div>
</div>
<!-- Message -->
<div class="col-md-6">
<div class="mb-3">
<label for="message" class="form-label">Message</label>
<textarea id="message" name="message" class="form-control" rows="5" placeholder=""></textarea>
<div class="form-text">Add any notes here</div>
</div>
</div>
</div>
<!--Submit info-->
<div class="bg-light border-top rounded-bottom px-3 py-2 d-flex justify-content-end gap-2">
<button type="button" class="btn btn-secondary">Cancel</button>
<button type="submit" class="btn btn-primary">Send</button>
</div>
</form>
</div>
</div>
</div>
</body>
</html>
